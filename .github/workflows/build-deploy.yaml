name: Build and Deploy to GitHub Pages
on: [push]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      MAPBOX_KEY: ${{ secrets.MAPBOX_API_KEY }}
    permissions:
      contents: write  # Grants permission to push code to the repository
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: Verify Secret Exists and is Non-Empty
        run: |
          if [ -z "$MAPBOX_KEY" ]; then
            echo "Error: MAPBOX_KEY is empty or not injected!"
            exit 1
          else
            echo "Success: MAPBOX_KEY is injected."
            # Check length instead of printing the secret value
            echo "Secret character count: ${#MAPBOX_KEY}"
          fi

      - name: build app
        run: npm run build
        env:
          APP_SECRET: ${{ secrets.MAPBOX_API_KEY }}

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to
          folder: build # The folder containing your compiled build files 